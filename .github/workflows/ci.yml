name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh | sh
          echo "$HOME/.bend/bin" >> $GITHUB_PATH

      - name: Verify Proofs
        run: |
          bend PROOF.bend

      - name: Check README Consistency
        run: |
          python3 tools/check_readme.py

      - name: Run Conformance & Differential Tests
        run: |
          python3 tests/run_tests.py --no-stretch --jobs 4
